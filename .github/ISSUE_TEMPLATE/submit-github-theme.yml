name: 提交在 GitHub 中开源的主题
description: Submit an open-source theme hosted on GitHub.
title: "[Theme] "
labels:
  - theme-submission
  - github-theme
body:
  - type: markdown
    attributes:
      value: |
        ## 提交在 GitHub 中开源的主题

        Submit an open-source theme hosted in a public GitHub repository.

  - type: input
    id: repository
    attributes:
      label: GitHub 仓库地址 / GitHub repository URL
      description: "示例 / Example: https://github.com/owner/repository"
      placeholder: "https://github.com/owner/repository"
    validations:
      required: true

  - type: input
    id: preview
    attributes:
      label: 预览图链接 / Preview image URL
      description: 请提供可公开访问的 HTTP(S) 图片链接。 / Provide a public HTTP(S) image URL.
      placeholder: "https://example.com/preview.png"
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: 我已确保 / I confirm
      options:
        - label: 仓库必须公开，且最新 Release 中必须提供可下载的主题包。 / The repository must be public and provide a downloadable theme package in its latest Release.
          required: true

  - type: markdown
    attributes:
      value: |
        市场会每六小时检查本仓库的最新 GitHub Release；验证通过的主题包发生变化时，会自动发起更新 PR。

        The market checks the latest GitHub Release every six hours and automatically opens an update PR when a verified package changes.
